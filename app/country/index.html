<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfricanMan.org · Country Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;background:#061018;color:#e1f4f4;font:14px/1.5 system-ui}button,input,select{font:inherit}button{cursor:pointer;background:#09222a;border:1px solid #167b80;color:#42eee5;border-radius:5px;padding:9px 12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #42eee5}header{padding:16px 20px;border-bottom:1px solid #1c5559;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;color:#3df5e8;letter-spacing:.12em;font-size:clamp(18px,3vw,26px)}.sub{color:#7daeb5;font-size:12px}main{padding:16px 20px}.tools{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:10px;margin:12px 0}.tools input,.tools select{background:#071b22;border:1px solid #23636b;color:#def;padding:12px;border-radius:6px;width:100%;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.tile,.detail{background:#081c24;border:1px solid #1a4c56;border-radius:9px;padding:14px}.tile strong{display:block}.city{color:#8fbec5}.time{font:700 22px ui-monospace,monospace;color:#37eee1;margin:8px 0}.date{font-size:12px;color:#8bbbc2}.tile button{margin-top:10px;padding:6px 12px}.tile.active{border-color:#39ebdf}.detail{margin:0 0 18px;border-color:#2d888d}.detail h2{margin:0 0 8px;color:#42eee5}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.fact{padding:9px;background:#0c2830;border:1px solid #204650;border-radius:5px;overflow-wrap:anywhere}.fact small{display:block;color:#8dbcc1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions a{color:#42eee5;border:1px solid #2b7477;border-radius:5px;padding:8px 10px;text-decoration:none}#notice{color:#a4b9bf;font-size:12px;margin:8px 0 14px}@media(max-width:550px){header{padding:12px}main{padding:12px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:10px}.time{font-size:18px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.module-nav button{flex:1;min-width:130px;font-weight:700}.module-nav button[aria-pressed=true]{background:#10414a;border-color:#42eee5}.module-body{background:#081b23;border:1px solid #1a5960;border-radius:8px;padding:14px;margin:8px 0;min-height:250px}.module-body h3{margin:0 0 12px;color:#40ede1;letter-spacing:.08em}.module-body iframe{width:100%;height:380px;border:1px solid #28646a;background:#09151b;border-radius:5px}.module-body select{width:100%;padding:10px;background:#102c35;color:#dff;border:1px solid #307a7b;border-radius:5px}.module-body p{color:#8dbac0}.module-body .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.module-body a{color:#42eee5}.fx-table{width:100%;border-collapse:collapse}.fx-table td,.fx-table th{padding:10px;border-bottom:1px solid #265059;text-align:left}.feed-links{display:flex;flex-wrap:wrap;gap:8px}.feed-links a{padding:9px 12px;border:1px solid #2c727a;border-radius:5px;text-decoration:none}@media(max-width:500px){.module-nav button{min-width:calc(50% - 8px)}.module-body iframe{height:280px}}
</style></head><body><header><div><h1 id="pageTitle">COUNTRY INTELLIGENCE</h1><div class="sub">AFRICANMAN · COUNTRY INTELLIGENCE</div></div><span class="sub" id="gmt"></span></header><main><section class="detail" id="detail" aria-live="polite" hidden><h2 id="countryName"></h2><div id="facts" class="facts"></div><div class="actions" id="actions"></div><nav class="module-nav" id="moduleNav" aria-label="Country intelligence sections"><button type="button" data-tab="dash" aria-pressed="true">DASH</button><button type="button" data-tab="travel" aria-pressed="false">TRAVEL</button><button type="button" data-tab="fx" aria-pressed="false">FX RATES</button><button type="button" data-tab="news" aria-pressed="false">LIVE NEWS</button></nav><div id="moduleBody" class="module-body" aria-live="polite"></div></section><div class="tools"><input id="search" type="search" placeholder="Search country or capital…" aria-label="Search country or capital"><select id="format" aria-label="Time format"><option value="auto">Auto Format</option><option value="12">12-hour</option><option value="24">24-hour</option></select><select id="jump" aria-label="Jump to country"><option value="">Jump to country…</option></select><button type="button" id="reset">RESET TO GMT</button></div><p id="notice">Country times use the AfrOsint country directory. Country profiles use public reference APIs when available.</p><div id="grid" class="grid"></div></main><script src="cities.js"></script><script src="news-channels.js"></script><script>
(()=>{'use strict';const all=window.AFRICANMAN_COUNTRY_CITIES||[],search=document.getElementById('search'),jump=document.getElementById('jump'),grid=document.getElementById('grid'),detail=document.getElementById('detail'),fmt=document.getElementById('format');let selected=null,req=0,profile=null,activeTab='dash',newsIndex=0;const aliases={'Congo (Brazzaville)':'Republic of the Congo','Congo (Kinshasa)':'DR Congo','Cape Verde':'Cabo Verde','Ivory Coast':"Côte d'Ivoire",'The Gambia':'Gambia','Swaziland':'Eswatini'};function match(name){const s=(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');return all.find(c=>[c.name,aliases[c.name],c.iso].some(n=>n&&n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')===s))}function clock(c){try{return new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',hour12:fmt.value==='12'?true:fmt.value==='24'?false:undefined}).format(new Date())}catch{return '—'}}function date(c){try{return new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,weekday:'short',day:'2-digit',month:'short'}).format(new Date())}catch{return '—'}}function flag(c){return /^[a-z]{2}$/.test(c.iso)?'https://flagcdn.com/w40/'+c.iso+'.png':''}function tile(c){const d=document.createElement('div');d.className='tile'+(selected===c?' active':'');const h=document.createElement('strong');if(flag(c)){const img=document.createElement('img');img.src=flag(c);img.width=24;img.height=16;img.alt='';img.style.marginRight='8px';h.append(img)}h.append(document.createTextNode(c.name));const city=document.createElement('div');city.className='city';city.textContent=c.city;const t=document.createElement('div');t.className='time';t.textContent=clock(c);const dt=document.createElement('div');dt.className='date';dt.textContent=date(c);const btn=document.createElement('button');btn.type='button';btn.textContent=selected===c?'SELECTED':'SET';btn.onclick=()=>select(c,true);d.append(h,city,t,dt,btn);return d}function render(){grid.replaceChildren(...all.filter(c=>(c.name+' '+c.city).toLowerCase().includes(search.value.toLowerCase())).map(tile))}function fact(label,value){const el=document.createElement('div');el.className='fact';const small=document.createElement('small');small.textContent=label;const b=document.createElement('strong');b.textContent=value??'Unavailable';el.append(small,b);return el}function link(label,url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label+' ↗';return a}function node(tag,content){const n=document.createElement(tag);if(content!==undefined)n.textContent=content;return n}function embed(url){const f=document.createElement('iframe');f.src=url;f.title='Country live broadcast';f.loading='lazy';f.referrerPolicy='strict-origin-when-cross-origin';f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;return f}function channels(c){return window.AFRICANMAN_NEWS_CHANNELS?.[c.name]||[window.AFRICANMAN_NEWS_FALLBACK?.[c.name]||{name:'Arise News',embed:'https://www.youtube.com/embed/TJ5V8KRSu9Y'}]}function renderTab(tab){if(!selected)return;activeTab=tab;document.querySelectorAll('#moduleNav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));const body=document.getElementById('moduleBody');body.replaceChildren();const title=node('h3',tab==='dash'?'DASH — '+selected.name:tab==='travel'?'TRAVEL — '+selected.name:tab==='fx'?'FX RATES — '+selected.name:'LIVE NEWS — '+selected.name);body.append(title);if(tab==='dash'||tab==='news'){const list=channels(selected);newsIndex=Math.min(newsIndex,list.length-1);const selector=node('select');selector.setAttribute('aria-label','Select country broadcast');list.forEach((ch,i)=>{const o=node('option',ch.name);o.value=String(i);selector.append(o)});selector.value=String(newsIndex);selector.onchange=()=>{newsIndex=Number(selector.value);renderTab(tab)};body.append(selector);const ch=list[newsIndex];if(/^https:\/\/www\.youtube\.com\/embed\//.test(ch.embed)||/^https:\/\/africa24tv\.com\//.test(ch.embed))body.append(embed(ch.embed));else body.append(node('p','Broadcast provider cannot be embedded.'));const p=node('p','Some broadcasters may restrict playback on third-party sites.');body.append(p);const links=node('div');links.className='feed-links';links.append(link('Open broadcast',ch.embed),link('More '+selected.name+' news','https://news.google.com/search?q='+encodeURIComponent(selected.name)));body.append(links);return}if(tab==='travel'){body.append(node('p','Travel guidance and entry information for '+selected.name+'.'));const links=node('div');links.className='feed-links';links.append(link('UK Foreign Travel Advice','https://www.gov.uk/foreign-travel-advice/'+encodeURIComponent(selected.name.toLowerCase().replaceAll(' ','-'))),link('Passport Index','https://www.passportindex.org/passport/'+encodeURIComponent(selected.name.toLowerCase().replaceAll(' ','-'))+'/'));body.append(links);body.append(node('p','Travel guidance opens at its original publisher; it cannot be reliably embedded.'));return}const code=Object.keys(profile?.currencies||{})[0];if(!code){body.append(node('p','Currency data is unavailable for this country.'));return}body.append(node('p','Currency: '+code+' · USD reference rates'));const table=node('table');table.className='fx-table';const tbody=node('tbody');table.append(tbody);body.append(table);const current=req;fetch('https://api.exchangerate-api.com/v4/latest/USD',{signal:AbortSignal.timeout(9000)}).then(r=>{if(!r.ok)throw Error('FX provider unavailable');return r.json()}).then(data=>{if(req!==current||activeTab!=='fx')return;tbody.replaceChildren();const base=data.rates?.[code];if(!base)throw Error('Currency not covered');for(const target of ['USD','GBP','EUR','CNY','CAD','NGN']){const rate=data.rates[target]/base;if(!Number.isFinite(rate))continue;const tr=node('tr');tr.append(node('th','1 '+code+' ='),node('td',rate.toFixed(4)+' '+target));tbody.append(tr)}}).catch(()=>{if(req===current&&activeTab==='fx')body.append(node('p','Live FX data is currently unavailable.'))})}document.getElementById('moduleNav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)renderTab(b.dataset.tab)});
async function select(c,scroll){selected=c;profile=null;newsIndex=0;const id=++req;renderTab('dash');detail.hidden=false;document.getElementById('countryName').textContent=c.name;const facts=document.getElementById('facts'),actions=document.getElementById('actions');facts.replaceChildren(fact('Capital',c.city),fact('Local time',clock(c)),fact('Timezone',c.tz),fact('Country information','Loading…'));actions.replaceChildren();jump.value=c.iso;render();if(scroll)detail.scrollIntoView({behavior:'smooth',block:'start'});try{const r=await fetch('https://restcountries.com/v3.1/alpha/'+encodeURIComponent(c.iso)+'?fields=name,capital,region,subregion,population,area,currencies,languages,latlng,flags',{signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error('Country API unavailable');const d=await r.json();if(id!==req)return;profile=d;const currency=Object.entries(d.currencies||{}).map(([code,v])=>v.name+' ('+code+')').join(', ')||'Unavailable';facts.replaceChildren(fact('Capital',d.capital?.join(', ')||c.city),fact('Local time',clock(c)),fact('Region',d.region),fact('Subregion',d.subregion),fact('Population',d.population?.toLocaleString('en-GB')),fact('Area',d.area?.toLocaleString('en-GB')+' km²'),fact('Currency',currency),fact('Languages',Object.values(d.languages||{}).join(', ')),fact('Timezone',c.tz));if(d.latlng?.length===2)actions.append(link('Google Maps','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.latlng.join(','))));}catch(e){if(id===req)facts.replaceChildren(fact('Capital',c.city),fact('Local time',clock(c)),fact('Timezone',c.tz),fact('Profile','Currently unavailable'))}}all.forEach(c=>{const o=document.createElement('option');o.value=c.iso;o.textContent=c.name;jump.append(o)});jump.onchange=()=>{const c=all.find(x=>x.iso===jump.value);if(c)select(c,true)};search.oninput=render;fmt.onchange=render;document.getElementById('reset').onclick=()=>{selected=null;detail.hidden=true;search.value='';jump.value='';render()};function tick(){document.getElementById('gmt').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Etc/GMT',hour:'2-digit',minute:'2-digit'}).format(new Date())+' GMT';for(const el of grid.children){const name=el.querySelector('strong')?.textContent,c=all.find(x=>x.name===name);if(c){el.querySelector('.time').textContent=clock(c);el.querySelector('.date').textContent=date(c)}}}render();tick();setInterval(tick,30000);const requested=new URLSearchParams(location.search).get('country');const c=match(requested);if(c){document.getElementById('pageTitle').textContent=c.name.toUpperCase();document.querySelector('.tools').style.display='none';document.getElementById('grid').style.display='none';document.getElementById('notice').style.display='none';select(c,false);}})();
</script></body></html>
