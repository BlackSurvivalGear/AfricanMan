<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfricanMan.org | Country Module</title><style>
*{box-sizing:border-box}body{margin:0;background:#061018;color:#e1f4f4;font:14px/1.5 system-ui}button,input,select{font:inherit}button{cursor:pointer;background:#09222a;border:1px solid #167b80;color:#42eee5;border-radius:5px;padding:9px 12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #42eee5}header{padding:16px 20px;border-bottom:1px solid #1c5559;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;color:#3df5e8;letter-spacing:.12em;font-size:clamp(18px,3vw,26px)}.sub{color:#7daeb5;font-size:12px}main{padding:16px 20px}.tools{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:10px;margin:12px 0}.tools input,.tools select{background:#071b22;border:1px solid #23636b;color:#def;padding:12px;border-radius:6px;width:100%;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.tile,.detail{background:#081c24;border:1px solid #1a4c56;border-radius:9px;padding:14px}.tile strong{display:block}.city{color:#8fbec5}.time{font:700 22px ui-monospace,monospace;color:#37eee1;margin:8px 0}.date{font-size:12px;color:#8bbbc2}.tile button{margin-top:10px;padding:6px 12px}.tile.active{border-color:#39ebdf}.detail{margin:0 0 18px;border-color:#2d888d}.detail h2{margin:0 0 8px;color:#42eee5}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.fact{padding:9px;background:#0c2830;border:1px solid #204650;border-radius:5px;overflow-wrap:anywhere}.fact small{display:block;color:#8dbcc1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions a{color:#42eee5;border:1px solid #2b7477;border-radius:5px;padding:8px 10px;text-decoration:none}#notice{color:#a4b9bf;font-size:12px;margin:8px 0 14px}@media(max-width:550px){header{padding:12px}main{padding:12px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:10px}.time{font-size:18px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>AFRICAN TIME</h1><div class="sub">AFRICANMAN · COUNTRY INTELLIGENCE</div></div><span class="sub" id="gmt"></span></header><main><section class="detail" id="detail" aria-live="polite" hidden><h2 id="countryName"></h2><div id="facts" class="facts"></div><div class="actions" id="actions"></div></section><div class="tools"><input id="search" type="search" placeholder="Search country or capital…" aria-label="Search country or capital"><select id="format" aria-label="Time format"><option value="auto">Auto Format</option><option value="12">12-hour</option><option value="24">24-hour</option></select><select id="jump" aria-label="Jump to country"><option value="">Jump to country…</option></select><button type="button" id="reset">RESET TO GMT</button></div><p id="notice">Country times use the AfrOsint country directory. Country profiles use public reference APIs when available.</p><div id="grid" class="grid"></div></main><script src="cities.js"></script><script>
(()=>{'use strict';const all=window.AFRICANMAN_COUNTRY_CITIES||[],search=document.getElementById('search'),jump=document.getElementById('jump'),grid=document.getElementById('grid'),detail=document.getElementById('detail'),fmt=document.getElementById('format');let selected=null,req=0;const aliases={'Congo (Brazzaville)':'Republic of the Congo','Congo (Kinshasa)':'DR Congo','Cape Verde':'Cabo Verde','Ivory Coast':"Côte d'Ivoire",'The Gambia':'Gambia','Swaziland':'Eswatini'};function match(name){const s=(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');return all.find(c=>[c.name,aliases[c.name],c.iso].some(n=>n&&n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')===s))}function clock(c){try{return new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',hour12:fmt.value==='12'?true:fmt.value==='24'?false:undefined}).format(new Date())}catch{return '—'}}function date(c){try{return new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,weekday:'short',day:'2-digit',month:'short'}).format(new Date())}catch{return '—'}}function flag(c){return /^[a-z]{2}$/.test(c.iso)?'https://flagcdn.com/w40/'+c.iso+'.png':''}function tile(c){const d=document.createElement('div');d.className='tile'+(selected===c?' active':'');const h=document.createElement('strong');if(flag(c)){const img=document.createElement('img');img.src=flag(c);img.width=24;img.height=16;img.alt='';img.style.marginRight='8px';h.append(img)}h.append(document.createTextNode(c.name));const city=document.createElement('div');city.className='city';city.textContent=c.city;const t=document.createElement('div');t.className='time';t.textContent=clock(c);const dt=document.createElement('div');dt.className='date';dt.textContent=date(c);const btn=document.createElement('button');btn.type='button';btn.textContent=selected===c?'SELECTED':'SET';btn.onclick=()=>select(c,true);d.append(h,city,t,dt,btn);return d}function render(){grid.replaceChildren(...all.filter(c=>(c.name+' '+c.city).toLowerCase().includes(search.value.toLowerCase())).map(tile))}function fact(label,value){const el=document.createElement('div');el.className='fact';const small=document.createElement('small');small.textContent=label;const b=document.createElement('strong');b.textContent=value??'Unavailable';el.append(small,b);return el}function link(label,url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label+' ↗';return a}async function select(c,scroll){selected=c;const id=++req;detail.hidden=false;document.getElementById('countryName').textContent=c.name;const facts=document.getElementById('facts'),actions=document.getElementById('actions');facts.replaceChildren(fact('Capital',c.city),fact('Local time',clock(c)),fact('Timezone',c.tz),fact('Country information','Loading…'));actions.replaceChildren();jump.value=c.iso;render();if(scroll)detail.scrollIntoView({behavior:'smooth',block:'start'});try{const r=await fetch('https://restcountries.com/v3.1/alpha/'+encodeURIComponent(c.iso)+'?fields=name,capital,region,subregion,population,area,currencies,languages,latlng,flags',{signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error('Country API unavailable');const d=await r.json();if(id!==req)return;const currency=Object.entries(d.currencies||{}).map(([code,v])=>v.name+' ('+code+')').join(', ')||'Unavailable';facts.replaceChildren(fact('Capital',d.capital?.join(', ')||c.city),fact('Local time',clock(c)),fact('Region',d.region),fact('Subregion',d.subregion),fact('Population',d.population?.toLocaleString('en-GB')),fact('Area',d.area?.toLocaleString('en-GB')+' km²'),fact('Currency',currency),fact('Languages',Object.values(d.languages||{}).join(', ')),fact('Timezone',c.tz));if(d.latlng?.length===2)actions.append(link('Google Maps','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.latlng.join(','))));actions.append(link('Country news','https://news.google.com/search?q='+encodeURIComponent(c.name)))}catch(e){if(id===req)facts.replaceChildren(fact('Capital',c.city),fact('Local time',clock(c)),fact('Timezone',c.tz),fact('Profile','Currently unavailable'))}}all.forEach(c=>{const o=document.createElement('option');o.value=c.iso;o.textContent=c.name;jump.append(o)});jump.onchange=()=>{const c=all.find(x=>x.iso===jump.value);if(c)select(c,true)};search.oninput=render;fmt.onchange=render;document.getElementById('reset').onclick=()=>{selected=null;detail.hidden=true;search.value='';jump.value='';render()};function tick(){document.getElementById('gmt').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Etc/GMT',hour:'2-digit',minute:'2-digit'}).format(new Date())+' GMT';for(const el of grid.children){const name=el.querySelector('strong')?.textContent,c=all.find(x=>x.name===name);if(c){el.querySelector('.time').textContent=clock(c);el.querySelector('.date').textContent=date(c)}}}render();tick();setInterval(tick,30000);const requested=new URLSearchParams(location.search).get('country');const c=match(requested);if(c)select(c,false);})();
</script></body></html>
